<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Das gebrochene Siegel der Muttagils</title>
<style>
/* ============================================================
   DAS GEBROCHENE SIEGEL DER MUTTAGILS  (Revision 2)
   Ein MIDGARD-Zugangsrätsel — vollständig lokal lauffähig.
   6x6-Raster, 36 Fragmente. Alle Variablen unten zentral änderbar.
   ============================================================ */
:root{
  --stone-dark:#15181c;
  --stone-mid:#22262c;
  --stone-light:#2f343b;
  --metal:#3a3f47;
  --metal-light:#565c65;
  --ink:#0c0f13;
  --silver:#c9d3da;
  --silver-dim:#828a92;
  --turquoise:#59d9c8;
  --turquoise-bright:#a9fff0;
  --text:#d9dee2;
  --text-dim:#9aa2a9;
}

*{box-sizing:border-box;}

html,body{
  margin:0; padding:0; min-height:100%;
  background:
    radial-gradient(ellipse at 50% 0%, #23272d 0%, #14171b 55%, #0a0c0e 100%);
  color:var(--text);
  font-family:'Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif;
}

body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.55) 100%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 7px),
    repeating-linear-gradient(25deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 9px);
  z-index:0;
}

/* Dezentes, unregelmäßiges Fackellicht-Flackern über die ganze Szene —
   sehr sanft (Helligkeit schwankt nur minimal), damit es atmosphärisch
   wirkt statt ablenkend zu blinken. Mehrere Keyframe-Stufen mit
   ungleichmäßigem Timing statt eines simplen Sinus-Pulses, damit es
   nicht wie ein mechanischer Rhythmus wirkt. */
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%, rgba(255,200,140,0.05) 0%, transparent 55%);
  z-index:0;
  animation:torchFlicker 6.5s ease-in-out infinite;
}
@keyframes torchFlicker{
  0%{ opacity:0.7; }
  8%{ opacity:0.95; }
  15%{ opacity:0.6; }
  24%{ opacity:1; }
  33%{ opacity:0.75; }
  45%{ opacity:0.85; }
  52%{ opacity:0.55; }
  64%{ opacity:0.9; }
  73%{ opacity:0.68; }
  85%{ opacity:0.92; }
  93%{ opacity:0.6; }
  100%{ opacity:0.7; }
}

.page{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 18px 60px; }

h1{
  text-align:center; font-weight:normal; font-variant:small-caps;
  letter-spacing:3px; font-size:1.7rem; color:var(--silver);
  text-shadow:0 0 18px rgba(89,217,200,0.15); margin:0 0 4px;
}
.subtitle{ text-align:center; color:var(--text-dim); font-style:italic; font-size:0.9rem; margin-bottom:22px; }

.panel{
  background:linear-gradient(180deg, var(--stone-mid), var(--stone-dark));
  border:1px solid rgba(130,138,146,0.25);
  border-radius:6px;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.45);
  padding:16px 18px; margin-bottom:18px;
}
.panel p{ line-height:1.55; margin:0 0 10px; color:var(--text);}
.panel ul{ margin:6px 0 0; padding-left:20px; color:var(--text-dim); font-size:0.92rem; line-height:1.5;}

/* ---------- Mosaik-Board (6x6) ---------- */
.board-wrap{ display:flex; justify-content:center; margin:22px 0; }
.board{
  --cell:min(15.8vw, 96px);
  display:grid;
  grid-template-columns:repeat(6, var(--cell));
  grid-template-rows:repeat(6, var(--cell));
  gap:4px;
  padding:12px;
  background:linear-gradient(160deg, #1c2024, #0c0e10);
  border:1px solid rgba(130,138,146,0.3);
  border-radius:8px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 10px 30px rgba(0,0,0,0.6);
  position:relative;
}

.tile{
  position:relative; border-radius:3px; overflow:hidden; cursor:grab;
  background:linear-gradient(155deg, var(--stone-light), var(--stone-dark));
  box-shadow: inset 0 0 6px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.03);
  outline:1px solid transparent; outline-offset:1px;
  transition:outline-color .2s ease, transform .15s ease;
}
.tile:active{ cursor:grabbing; }
.tile.drag-over{ outline-color:rgba(201,211,218,0.6); }
.tile.selected{ outline-color:rgba(89,217,200,0.55); }

.tile-inner{ position:absolute; inset:0; transition:transform .35s ease; transform-origin:50% 50%; }
.tile-inner svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.tile-inner svg.art{ z-index:1; }
.tile-inner svg.lines{ z-index:2; pointer-events:none; }

.path-line{
  stroke:rgba(89,217,200,0.22); stroke-width:2; stroke-linecap:round; fill:none;
  transition:stroke .6s ease, stroke-width .6s ease;
}
.path-line.node{ fill:rgba(89,217,200,0.28); stroke:none; }
.board.solved .path-line{
  stroke:var(--turquoise-bright); stroke-width:2.6;
  filter:drop-shadow(0 0 3px var(--turquoise));
  animation:lineGlow 1.6s ease-in-out infinite alternate;
}
.board.solved .path-line.node{ fill:var(--turquoise-bright); }
@keyframes lineGlow{ from{opacity:0.75;} to{opacity:1;} }

#central-rune-glow circle, #central-rune-glow path{ transition:opacity .8s ease; }
#central-rune-glow.active circle, #central-rune-glow.active path{
  opacity:1 !important; stroke:var(--turquoise-bright);
  filter:drop-shadow(0 0 6px var(--turquoise));
}

.board.pulse-once{ animation:boardPulse 1.1s ease; }
@keyframes boardPulse{ 0%{filter:brightness(1);} 40%{filter:brightness(1.35);} 100%{filter:brightness(1);} }

.board.error-flash{ animation:errorFlash .45s ease; }
@keyframes errorFlash{
  0%{ transform:translateX(0); filter:brightness(1); }
  15%{ transform:translateX(-5px); filter:brightness(1.5) saturate(0.6); }
  30%{ transform:translateX(4px); }
  45%{ transform:translateX(-3px); filter:brightness(1.2); }
  60%{ transform:translateX(3px); }
  75%{ transform:translateX(-1px); }
  100%{ transform:translateX(0); filter:brightness(1); }
}

.board.darkened::after{
  content:""; position:absolute; inset:0; background:rgba(0,0,0,0.55);
  pointer-events:none; animation:fadeIn 2s ease forwards;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

button.stone-btn{
  font-family:inherit;
  background:linear-gradient(180deg, var(--metal-light), var(--metal) 60%, #2a2e33);
  color:var(--text); border:1px solid rgba(0,0,0,0.5); border-top-color:rgba(255,255,255,0.08);
  padding:9px 16px; border-radius:4px; font-size:0.88rem; letter-spacing:0.4px; cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,0.4), inset 0 0 8px rgba(0,0,0,0.3);
}
button.stone-btn:hover{ background:linear-gradient(180deg,#61686f, var(--metal) 60%, #2a2e33); }
button.stone-btn:disabled{ opacity:0.45; cursor:default; }
button.stone-btn.subtle{ font-size:0.78rem; padding:6px 12px; opacity:0.85; }
button.stone-btn.confirm-armed{
  background:linear-gradient(180deg, #8a5a4a, #6b4238 60%, #4a2c26);
  border-color:rgba(180,110,90,0.5);
  color:#f0e0d8;
  opacity:1;
}

.controls-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px; }


.status-text{ text-align:center; min-height:1.4em; color:var(--turquoise); font-style:italic; margin:14px 0; white-space:pre-line;}

.key-panel{ text-align:center; }
.key-panel input[type="text"]{
  font-family:inherit; background:var(--ink); border:1px solid rgba(130,138,146,0.4);
  color:var(--silver); padding:8px 10px; border-radius:4px; font-size:0.95rem;
  text-align:center; letter-spacing:1px; margin:8px 6px;
}
.key-fail{ color:#b98c8c; font-style:italic; font-size:0.85rem; min-height:1.2em; }

#gm-gear{
  position:fixed; bottom:10px; right:10px; width:16px; height:16px;
  opacity:0.28; cursor:pointer; z-index:50; filter:grayscale(1); transition:opacity .3s ease;
}
#gm-gear:hover{ opacity:0.7; }

#gm-panel{
  display:none; position:fixed; bottom:34px; right:10px; width:290px; max-height:70vh; overflow:auto;
  background:var(--ink); border:1px solid rgba(130,138,146,0.4); border-radius:6px; padding:12px;
  z-index:51; box-shadow:0 8px 24px rgba(0,0,0,0.6); font-size:0.8rem;
}
#gm-panel h3{ margin:0 0 8px; font-size:0.85rem; color:var(--turquoise); font-weight:normal;}
#gm-panel .controls-row{ justify-content:flex-start; }
#gm-panel pre{
  background:#080a0c; color:#9fdccb; padding:8px; border-radius:4px;
  font-size:0.65rem; max-height:220px; overflow:auto; white-space:pre-wrap;
}

footer.credits{ text-align:center; color:var(--text-dim); font-size:0.72rem; margin-top:30px; opacity:0.6; }

@media (max-width:480px){
  h1{ font-size:1.25rem; letter-spacing:1.2px; }
  .board{ --cell: min(15.5vw, 58px); gap:3px; padding:8px; }
}
/* ============ DEBUG-OVERLAY (nur nach Passwort-Freischaltung) ============ */
.debug-overlay{
  position:absolute; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; pointer-events:none;
  background:rgba(0,0,0,0.55);
}
.debug-line{
  font-family:monospace; font-weight:bold; font-size:0.62rem;
  line-height:1.15; padding:0 3px; border-radius:2px;
  background:rgba(0,0,0,0.4); white-space:nowrap;
}
.debug-id{ font-size:0.85rem; color:#fff; background:rgba(30,100,90,0.6); }
.debug-ok{ color:#7CFC98; }
.debug-bad{ color:#ff8a6b; background:rgba(90,20,10,0.6); }
</style>
</head>
<body>

<div class="page">
  <h1>Das gebrochene Siegel der Muttagils</h1>
  <div class="subtitle">Zugangssicherung der alten Muttagil-Anlage</div>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="status-text" id="status-text"></div>

  <div class="controls-row">
    <button class="stone-btn" id="lock-in-btn">Einrasten</button>
    <button class="stone-btn subtle" id="reset-btn">Kacheln neu mischen</button>
    <button class="stone-btn subtle" id="mute-btn">🔈 Ton an/aus</button>
    <button class="stone-btn subtle" id="solution-btn">Debug-Modus freischalten</button>
  </div>

  <div class="key-panel" id="solution-pw-wrap" style="display:none;">
    <p>Ein altes Symbol verlangt ein Passwort, bevor es die Musterlösung offenbart.</p>
    <input type="text" id="solution-pw-input" autocomplete="off" spellcheck="false">
    <br>
    <button class="stone-btn subtle" id="solution-pw-submit">Bestätigen</button>
    <button class="stone-btn subtle" id="solution-pw-cancel">Abbrechen</button>
    <div class="key-fail" id="solution-pw-fail"></div>
  </div>


  <div class="panel" id="success-panel" style="display:none;">
    <p id="success-text"></p>
    <div class="controls-row" id="lock-btn-wrap" style="display:none;">
      <button class="stone-btn" id="lock-btn">Schloss untersuchen</button>
    </div>
    <div class="key-panel" id="key-input-wrap" style="display:none;">
      <p>Ein Wort scheint den Mechanismus zu erwarten.</p>
      <input type="text" id="key-input" autocomplete="off" spellcheck="false">
      <br>
      <button class="stone-btn subtle" id="key-submit">Wort einsetzen</button>
      <div class="key-fail" id="key-fail"></div>
    </div>
  </div>

  <footer class="credits">Das gebrochene Siegel der Muttagils — MIDGARD-Zugangsrätsel</footer>
</div>

<svg id="gm-gear" viewBox="0 0 24 24" title="">
  <path fill="#aaa" d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4a7 7 0 00-.15-1.45l2-1.55-2-3.46-2.35.95a7.4 7.4 0 00-1.25-.72L17 2h-4l-.25 2.77c-.44.18-.86.42-1.25.72L9.15 4.54l-2 3.46 2 1.55A7 7 0 009 12c0 .49.05.97.15 1.45l-2 1.55 2 3.46 2.35-.95c.39.3.81.54 1.25.72L13 22h4l.25-2.77c.44-.18.86-.42 1.25-.72l2.35.95 2-3.46-2-1.55c.1-.48.15-.96.15-1.45z"/>
</svg>
<div id="gm-panel">
  <h3>Spielleiterbereich</h3>
  <div class="controls-row">
    <button class="stone-btn subtle" id="gm-solve">Rätsel sofort lösen</button>
    <button class="stone-btn subtle" id="gm-reset">Rätsel zurücksetzen</button>
    <button class="stone-btn subtle" id="gm-showsol">Lösung anzeigen</button>
    <button class="stone-btn subtle" id="gm-testanim">Erfolgsanimation testen</button>
    <button class="stone-btn subtle" id="gm-state">Zustand anzeigen</button>
    <button class="stone-btn subtle" id="gm-clearls">localStorage löschen</button>
  </div>
  <pre id="gm-output" style="display:none;"></pre>
</div>

/* ============================================================
   ZUSTAND
   ============================================================ */
let state = null;

/* Fisher-Yates-Mischung */
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* Erzeugt eine komplett neu gewürfelte Fragment-Anordnung: Positionen
   zufällig permutiert, Spiegelzustände und Rotationen zufällig gesetzt.
   Da Fragmente frei mit jedem anderen Feld getauscht werden können
   (keine Nachbarschafts-Einschränkung) und Spiegeln/Rotieren simple
   Umschalter sind, ist JEDE so erzeugte Anordnung garantiert lösbar. */
function createShuffledTiles(){
  const positions = shuffleArray(TILE_DEFS.map(def => def.correctIndex));
  return TILE_DEFS.map((def, i) => ({
    id: def.id,
    correctIndex: def.correctIndex,
    currentIndex: positions[i],
    mirrorable: def.mirrorable,
    correctMirror: def.correctMirror,
    currentMirror: def.mirrorable ? (Math.random() < 0.5) : false,
    correctRotation: def.correctRotation,
    currentRotation: [0, 90, 180, 270][Math.floor(Math.random() * 4)],
    connections: def.connections.slice()
  }));
}

function isTrivialSolve(tiles){
  return tiles.every(t =>
    t.currentIndex === t.correctIndex &&
    (!t.mirrorable || t.currentMirror === t.correctMirror) &&
    t.currentRotation === t.correctRotation
  );
}

function defaultState(){
  let tiles;
  let attempts = 0;
  do{
    tiles = createShuffledTiles();
    attempts++;
  } while(attempts < 20 && isTrivialSolve(tiles));

  return {
    tiles,
    selectedTileId: null,
    solved: false,
    keyInserted: false,
    ukubuSolved: false,
    animationPlayed: false
  };
}

/* ============================================================
   PERSISTENZ
   ============================================================ */
function saveGame(){
  try{
    const data = {
      tiles: state.tiles.map(t => ({
        id: t.id, currentIndex: t.currentIndex,
        currentMirror: t.currentMirror, currentRotation: t.currentRotation
      })),
      solved: state.solved,
      keyInserted: state.keyInserted,
      ukubuSolved: state.ukubuSolved,
      animationPlayed: state.animationPlayed
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){}
}

function loadGame(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
  state = defaultState();
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.tiles)) return;
    data.tiles.forEach(saved => {
      const tile = state.tiles.find(t => t.id === saved.id);
      if(tile){
        if(typeof saved.currentIndex === "number") tile.currentIndex = saved.currentIndex;
        if(typeof saved.currentMirror === "boolean") tile.currentMirror = saved.currentMirror;
        if(typeof saved.currentRotation === "number") tile.currentRotation = saved.currentRotation;
      }
    });
    if(typeof data.solved === "boolean") state.solved = data.solved;
    if(typeof data.keyInserted === "boolean") state.keyInserted = data.keyInserted;
    if(typeof data.ukubuSolved === "boolean") state.ukubuSolved = data.ukubuSolved;
    if(typeof data.animationPlayed === "boolean") state.animationPlayed = data.animationPlayed;
  }catch(e){}
}

/* Mischt sofort neu (kein natives window.confirm() — das kann in

/* Zwei-Klick-Bestätigung direkt am Button, damit das Mischen nicht
   versehentlich ausgelöst wird — ohne einen nativen Dialog zu nutzen.
   Erster Klick "bewaffnet" den Button (Text/Farbe ändern sich kurz zu
   einer Warnung), erst ein zweiter Klick innerhalb weniger Sekunden
   löst das tatsächliche Mischen aus. Ohne Bestätigung fällt der Button
   nach kurzer Zeit automatisch in den Normalzustand zurück. */
let resetArmed = false;
let resetArmTimeout = null;

function handleResetButtonClick(){
  const btn = document.getElementById("reset-btn");
  if(!btn || btn.disabled) return;

  if(!resetArmed){
    resetArmed = true;
    btn.textContent = "Wirklich neu mischen?";
    btn.classList.add("confirm-armed");
    resetArmTimeout = setTimeout(disarmResetButton, 4000);
  } else {
    disarmResetButton();
    resetGame();
  }
}

function disarmResetButton(){
  resetArmed = false;
  if(resetArmTimeout){ clearTimeout(resetArmTimeout); resetArmTimeout = null; }
  const btn = document.getElementById("reset-btn");
  if(btn){
    btn.textContent = "Kacheln neu mischen";
    btn.classList.remove("confirm-armed");
  }
}

/* ============================================================
   GEOMETRIE-HILFSFUNKTIONEN
   ============================================================ */
function rowColOf(pos){
  return { row: Math.floor((pos - 1) / GRID_SIZE), col: (pos - 1) % GRID_SIZE };
}
function posOf(row, col){
  return row * GRID_SIZE + col + 1;
}
const OPPOSITE = { top: "bottom", bottom: "top", left: "right", right: "left" };

function neighborPos(pos, dir){
  const { row, col } = rowColOf(pos);
  let nr = row, nc = col;
  if(dir === "top") nr -= 1;
  else if(dir === "bottom") nr += 1;
  else if(dir === "left") nc -= 1;
  else if(dir === "right") nc += 1;
  if(nr < 0 || nr > GRID_SIZE - 1 || nc < 0 || nc > GRID_SIZE - 1) return null;
  return posOf(nr, nc);
}

function isAllowedExternal(pos, dir){
  return EXTERNAL_POINTS.some(e => e.pos === pos && e.dir === dir);
}

/* Wirksame Leitlinien-Anschlüsse unter Berücksichtigung von Spiegelung
   UND Rotation. Reihenfolge ist fest definiert und muss zur visuellen
   CSS-Transformation passen: "transform: rotate(Rdeg) scaleX(±1)" wendet
   scaleX zuerst an (näher am Element), dann rotate — also spiegeln wir
   zuerst die Richtungsmenge und rotieren danach das Ergebnis. */
const ROTATE_CW_MAP = { top: "right", right: "bottom", bottom: "left", left: "top" };

function getEffectiveConnections(tile){
  let dirs = tile.connections;
  if(tile.currentMirror){
    dirs = dirs.map(dir => {
      if(dir === "left") return "right";
      if(dir === "right") return "left";
      return dir;
    });
  }
  const steps = (((tile.currentRotation || 0) / 90) % 4 + 4) % 4;
  for(let i = 0; i < steps; i++){
    dirs = dirs.map(dir => ROTATE_CW_MAP[dir]);
  }
  return dirs;
}

function tileAtPosition(pos){
  return state.tiles.find(t => t.currentIndex === pos) || null;
}

/* ============================================================
   RÄTSELPRÜFUNG
   ============================================================ */
function checkConnectionsNetwork(){
  for(let pos = 1; pos <= TOTAL_TILES; pos++){
    const tile = tileAtPosition(pos);
    if(!tile) return false;
    const eff = getEffectiveConnections(tile);
    for(const dir of eff){
      const nPos = neighborPos(pos, dir);
      if(nPos === null){
        if(!isAllowedExternal(pos, dir)) return false;
        continue;
      }
      const neighborTile = tileAtPosition(nPos);
      if(!neighborTile) return false;
      const neighborEff = getEffectiveConnections(neighborTile);
      if(!neighborEff.includes(OPPOSITE[dir])) return false;
    }
  }
  const graph = buildValidEdgeGraph();
  for(const ext of EXTERNAL_POINTS){
    if(!bfsReachesCenter(graph, ext.pos)) return false;
  }
  return true;
}

function buildValidEdgeGraph(){
  const graph = {};
  for(let pos = 1; pos <= TOTAL_TILES; pos++) graph[pos] = [];
  for(let pos = 1; pos <= TOTAL_TILES; pos++){
    const tile = tileAtPosition(pos);
    if(!tile) continue;
    const eff = getEffectiveConnections(tile);
    for(const dir of eff){
      const nPos = neighborPos(pos, dir);
      if(nPos === null) continue;
      const neighborTile = tileAtPosition(nPos);
      if(!neighborTile) continue;
      const neighborEff = getEffectiveConnections(neighborTile);
      if(neighborEff.includes(OPPOSITE[dir])){
        graph[pos].push(nPos);
      }
    }
  }
  return graph;
}

function bfsReachesCenter(graph, startPos){
  const visited = new Set([startPos]);
  const queue = [startPos];
  while(queue.length){
    const cur = queue.shift();
    if(CENTER_POSITIONS.includes(cur)) return true;
    for(const next of graph[cur]){
      if(!visited.has(next)){
        visited.add(next);
        queue.push(next);
      }
    }
  }
  return false;
}

function checkSolution(){
  for(const tile of state.tiles){
    if(tile.currentIndex !== tile.correctIndex) return false;
    if(tile.mirrorable && tile.currentMirror !== tile.correctMirror) return false;
    if(tile.currentRotation !== tile.correctRotation) return false;
  }
  if(!checkConnectionsNetwork()) return false;
  return true;
}

/* ============================================================
   SPIELHANDLUNGEN
   ============================================================ */
function swapTiles(idA, idB){
  if(idA === idB) return;
  const a = state.tiles.find(t => t.id === idA);
  const b = state.tiles.find(t => t.id === idB);
  if(!a || !b) return;
  const tmp = a.currentIndex;
  a.currentIndex = b.currentIndex;
  b.currentIndex = tmp;
  state.selectedTileId = null;
  playSound("swap");
  afterMove();
}

/* Klick auf eine Kachel wählt sie NUR aus (zeigt die Bedienelemente am
   Kachelrand) — es findet dabei ausdrücklich KEIN Tausch statt, auch
   nicht wenn danach eine zweite Kachel angeklickt wird. Tauschen bleibt
   ausschließlich Drag-and-Drop vorbehalten. */
function selectTile(id){
  if(state.solved) return;
  state.selectedTileId = (state.selectedTileId === id) ? null : id;
  renderBoard();
}

function mirrorTile(id){
  if(state.solved) return;
  const tile = state.tiles.find(t => t.id === id);
  if(!tile || !tile.mirrorable) return;
  tile.currentMirror = !tile.currentMirror;
  playSound("mirror");
  afterMove();
}

function rotateTile(id, direction){
  if(state.solved) return;
  const tile = state.tiles.find(t => t.id === id);
  if(!tile) return;
  // direction: "cw" (im Uhrzeigersinn) oder "ccw" (gegen den Uhrzeigersinn).
  // Spiegelzustand bleibt dabei unangetastet.
  const delta = direction === "ccw" ? 270 : 90;
  tile.currentRotation = (tile.currentRotation + delta) % 360;
  playSound("mirror");
  afterMove();
}

function afterMove(){
  renderBoard();
  saveGame();
}

/* Wird ausschließlich über den "Einrasten"-Button ausgelöst. Die Lösung
   wird NICHT mehr automatisch nach jeder Bewegung erkannt — die Spieler
   müssen aktiv bestätigen, dass sie das Siegel für vollständig halten.
   Bei einem Fehlversuch ertönt ein Blitzschlag und die Platte zuckt
   kurz — ohne irgendeine Information darüber preiszugeben, WAS falsch
   ist. */
function attemptSolve(){
  if(state.solved) return;
  if(checkSolution()){
    state.solved = true;
    // Auswahl aufheben und sofort neu rendern: sonst könnten die
    // Dreh-/Spiegel-Bedienelemente einer zuvor ausgewählten Kachel im
    // DOM stehen bleiben und wären — trotz gelöstem Rätsel — noch
    // anklickbar (die Guards oben fangen das zusätzlich ab, aber ein
    // sauberer Re-Render ist ohnehin richtig).
    state.selectedTileId = null;
    renderBoard();
    saveGame();
    triggerSuccess();
  } else {
    playSound("lightning");
    flashError();
  }
}

function flashError(){
  const board = document.getElementById("board");
  board.classList.remove("error-flash");
  // Reflow erzwingen, damit die Animation bei wiederholten Fehlversuchen
  // jedes Mal neu von vorne abgespielt wird.
  void board.offsetWidth;
  board.classList.add("error-flash");
  setTimeout(() => board.classList.remove("error-flash"), 450);
}

/* ============================================================
   ERFOLGSANIMATION UND ALLESSCHLÜSSEL
   ============================================================ */
function triggerSuccess(){
  document.getElementById("board").classList.add("solved");
  const lockBtn = document.getElementById("lock-in-btn");
  if(lockBtn) lockBtn.disabled = true;
  disarmResetButton();
  const resetBtn = document.getElementById("reset-btn");
  if(resetBtn) resetBtn.disabled = true;
  startSuccessAnimation();
}

function startSuccessAnimation(){
  const board = document.getElementById("board");
  const rune = document.getElementById("central-rune-glow");
  board.classList.add("solved");

  // Licht fließt entlang der Leitlinien von außen zum Zentrum
  setTimeout(() => { playSound("flow"); }, 100);
  setTimeout(() => { rune.classList.add("active"); }, 900);
  setTimeout(() => {
    board.classList.add("pulse-once");
    playSound("solve");
  }, 1500);
  setTimeout(() => { board.classList.remove("pulse-once"); }, 2700);
  setTimeout(() => { revealSuccessPanel(); }, 2900);
}

function revealSuccessPanel(){
  const panel = document.getElementById("success-panel");
  const text = document.getElementById("success-text");
  panel.style.display = "block";
  text.textContent = TEXT_SOLVED;
  if(!state.keyInserted && !state.ukubuSolved){
    document.getElementById("lock-btn-wrap").style.display = "flex";
  }
  if(typeof panel.scrollIntoView === "function"){
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function hideSuccessUI(){
  document.getElementById("board").classList.remove("solved", "darkened");
  document.getElementById("central-rune-glow").classList.remove("active");
  document.getElementById("success-panel").style.display = "none";
  document.getElementById("lock-btn-wrap").style.display = "none";
  document.getElementById("key-input-wrap").style.display = "none";
  document.getElementById("key-fail").textContent = "";
  const lockInBtn = document.getElementById("lock-in-btn");
  if(lockInBtn) lockInBtn.disabled = false;
  const resetBtn = document.getElementById("reset-btn");
  if(resetBtn) resetBtn.disabled = false;
  const input = document.getElementById("key-input");
  if(input) input.value = "";
}

function examineLock(){
  document.getElementById("lock-btn-wrap").style.display = "none";
  const text = document.getElementById("success-text");
  playSound("keyturn");
  setTimeout(() => {
    text.textContent = TEXT_LOCK_EXAMINE;
    setTimeout(() => {
      document.getElementById("key-input-wrap").style.display = "block";
      document.getElementById("key-input").focus();
    }, 900);
  }, 600);
}

function checkKeyword(){
  const input = document.getElementById("key-input");
  const val = (input.value || "").trim().toLowerCase();
  const failEl = document.getElementById("key-fail");

  if(val === KEYWORD){
    state.ukubuSolved = true;
    saveGame();
    failEl.textContent = "";
    document.getElementById("key-input-wrap").style.display = "none";
    const text = document.getElementById("success-text");
    text.textContent = TEXT_KEY_SUCCESS_1;
    playSound("open");
    document.getElementById("board").classList.add("darkened");
    setTimeout(() => {
      text.textContent = TEXT_KEY_SUCCESS_1 + "\n\n" + TEXT_KEY_SUCCESS_2;
      state.keyInserted = true;
      saveGame();

      // Der Mechanismus setzt sich nach einer Weile selbst zurück —
      // das Mosaik ist danach wieder ein frisches, ungelöstes Rätsel.
      // Der einmal freigelegte Zugang bleibt davon unberührt offen.
      setTimeout(() => {
        autoResetAfterOpening();
      }, AUTO_RESET_DELAY_MS);
    }, 1600);
  } else {
    failEl.textContent = TEXT_KEY_FAIL;
  }
}

/* Setzt das Mosaik automatisch zurück, nachdem der Zugang bereits
   freigelegt wurde. Der Zugang selbst bleibt bestehen — nur das
   Rätsel wird wieder zu einem frischen, ungelösten Puzzle. Der Hinweis
   dazu erscheint im Statustext unterhalb des Mosaiks und bleibt dort
   stehen (resetGame() selbst würde den Statustext sonst leeren). */
function autoResetAfterOpening(){
  if(!state.keyInserted) return; // wurde in der Zwischenzeit bereits anders zurückgesetzt
  resetGame();
  setStatusText(TEXT_PASSAGE_REMAINS_OPEN);
}

/* ============================================================
   RENDERING
   ============================================================ */
function setStatusText(txt){
  document.getElementById("status-text").textContent = txt || "";
}

/* ---------- KONFIGURATION: Leere Rückseiten ----------
   Alle 36 Fragmente sind spiegelbar. Ein Teil davon hat aber
   praktisch eine "leere Rückseite": Ist ein Fragment aus dieser Liste
   gespiegelt (currentMirror = true), wird statt des gespiegelten
   Bildes eine komplett leere Steinfläche gezeigt (kein Wappenbild,
   keine Leitlinien) — wie ein Fragment, das nur auf einer Seite
   beschriftet ist. Über das Raster verteilt.
   WICHTIG: 6 und 7 sind bewusst NICHT in dieser Liste — sie zeigen
   ihr eigenes, korrekt gespiegeltes Bild. Wären zu viele Fragmente
   "leer wenn falsch", ließe sich das Rätsel teilweise per simplem
   Ausschlussverfahren lösen (leer=falsch, Bild=richtig) statt durch
   echtes Prüfen des Musters. Für 6/7 gilt stattdessen: das jeweils
   eigene Bild muss tatsächlich betrachtet werden. Betrifft NUR die
   Darstellung — die Lösungsprüfung selbst läuft weiterhin ganz normal
   über currentMirror/correctMirror, unabhängig davon ob ein Fragment
   Leitlinien besitzt. */
const BLANK_BACK_IDS = new Set([1, 2, 4, 9, 12, 13, 19, 24, 28, 32, 34, 36]);

/* WICHTIG: Kein genereller Ausrichtungs-Hinweis (Pfeil/Kerbe) mehr im
   laufenden Rätsel — der hätte sofort verraten, wie ein Fragment
   gedreht werden muss, und damit die eigentliche Aufgabe umgangen.
   Das bedeutet bewusst: Bei einigen rein dekorativen Fragmenten in
   ruhigen Bildbereichen ist die korrekte Rotation nicht zuverlässig
   durch Hinsehen prüfbar. Ausprobieren über "Einrasten" und der
   Debug-Modus (siehe SOLUTION_PASSWORD) sind die vorgesehenen Auswege
   dafür.

   FRAGMENT 18 SONDERFALL: Der Schildrand verläuft dort exakt durch die
   lokale Mitte der Kachel und war dadurch beim Spiegeln komplett
   symmetrisch — nicht unterscheidbar. Statt eines aufgesetzten Details
   bekommt Fragment 18 hier eine zusätzliche, rein dekorative türkise
   Leitlinie bis zum rechten Kachelrand. Damit das wie eine echte
   Fortsetzung wirkt (nicht wie eine Linie, die "aus dem Nichts" kommt),
   bekommt Fragment 17 — direkt links daneben — passend dazu einen
   eigenen kurzen Linien-Stummel bis zu SEINEM rechten Rand. Liegen
   beide korrekt nebeneinander, verschmelzen die beiden Stummel optisch
   zu einer durchgehenden Linie über die Kachelgrenze hinweg. Beide
   Linien sind NUR im jeweils korrekten (ungespiegelten) Zustand da —
   beim Spiegeln fehlen sie komplett (kein Umklappen, echtes
   Verschwinden), genau wie bei den leeren Rückseiten. Sie zählen
   bewusst NICHT zu tile.connections und fließen daher nicht in
   checkConnectionsNetwork() ein — rein optische Fortsetzung, keine
   echte Netzwerk-Verbindung. */
function renderLinesMarkup(tile){
  let s = "";

  if(tile.connections.length){
    const pts = { top: [60, 6], right: [114, 60], bottom: [60, 114], left: [6, 60] };
    s += '<circle cx="60" cy="60" r="4" class="path-line node"></circle>';
    tile.connections.forEach(dir => {
      const [x, y] = pts[dir];
      s += `<line x1="60" y1="60" x2="${x}" y2="${y}" class="path-line"></line>`;
    });
  }

  if(tile.id === 18 && !tile.currentMirror){
    s += '<line x1="6" y1="60" x2="114" y2="60" class="path-line"></line>';
    s += '<circle cx="60" cy="60" r="4" class="path-line node"></circle>';
  }
  if(tile.id === 17 && !tile.currentMirror){
    s += '<line x1="60" y1="60" x2="114" y2="60" class="path-line"></line>';
  }

  return s;
}

function renderTile(tile){
  const { row, col } = rowColOf(tile.correctIndex);
  const vbX = col * 120, vbY = row * 120;
  const isSelected = state.selectedTileId === tile.id;

  const wrapper = document.createElement("div");
  wrapper.className = "tile" + (tile.mirrorable ? " mirrorable" : "") + (isSelected ? " selected" : "");
  wrapper.draggable = !state.solved;
  wrapper.dataset.id = tile.id;

  const inner = document.createElement("div");
  inner.className = "tile-inner";
  // Reihenfolge bewusst wie im CSS-Kommentar dokumentiert: erst spiegeln,
  // dann rotieren (scaleX steht rechts, wird also zuerst angewendet).
  inner.style.transform = `rotate(${tile.currentRotation}deg) scaleX(${tile.currentMirror ? -1 : 1})`;

  // "Leere Rückseite": bei den in BLANK_BACK_IDS gelisteten Fragmenten
  // wird im gespiegelten Zustand weder Wappenbild noch Leitlinie
  // gezeichnet — es bleibt nur die nackte Steinfläche der Kachel
  // sichtbar (kommt vom Hintergrund der Kachel selbst, nicht von hier).
  const isBlankBack = tile.currentMirror && BLANK_BACK_IDS.has(tile.id);
  if(isBlankBack){
    inner.innerHTML = "";
  } else {
    inner.innerHTML =
      `<svg class="art" viewBox="${vbX} ${vbY} 120 120" preserveAspectRatio="xMidYMid slice">` +
        `<use href="#wappen-master"></use>` +
      `</svg>` +
      `<svg class="lines" viewBox="0 0 120 120">${renderLinesMarkup(tile)}</svg>`;
  }
  wrapper.appendChild(inner);

  // Debug-Overlay: nur sichtbar, nachdem das Passwort am
  // "Debug-Modus freischalten"-Button eingegeben wurde. Zeigt ID
  // (=Zielposition), aktuelles Feld, Rotation und Spiegelstatus direkt
  // auf jeder Kachel — grün wenn korrekt, rot mit Zielangabe wenn
  // falsch. Steht in der DOM-Struktur außerhalb von "inner" und wird
  // dadurch NICHT von dessen rotate/scaleX-Transform miterfasst,
  // bleibt also immer aufrecht und lesbar.
  if(debugModeActive){
    const debugBox = document.createElement("div");
    debugBox.className = "debug-overlay";
    const mirrorLabel = tile.currentMirror ? "GESPIEGELT" : "ok";
    const rotOK = tile.currentRotation === 0;
    const posOK = tile.currentIndex === tile.correctIndex;
    const mirrOK = !tile.currentMirror;
    debugBox.innerHTML =
      `<div class="debug-line debug-id">ID ${tile.id}</div>` +
      `<div class="debug-line ${posOK ? 'debug-ok' : 'debug-bad'}">Feld ${tile.currentIndex}${posOK ? ' ✓' : ' → soll ' + tile.correctIndex}</div>` +
      `<div class="debug-line ${rotOK ? 'debug-ok' : 'debug-bad'}">${tile.currentRotation}°${rotOK ? ' ✓' : ' → soll 0°'}</div>` +
      `<div class="debug-line ${mirrOK ? 'debug-ok' : 'debug-bad'}">${mirrorLabel}</div>`;
    wrapper.appendChild(debugBox);
  }

  // Bedienung erfolgt über die Tastatur, sobald eine Kachel ausgewählt
  // ist (Pfeiltasten links/rechts = drehen, hoch/runter = spiegeln) —
  // siehe handleKeyboardTileControl(). Es gibt bewusst keine Maus-
  // Symbole mehr auf der Kachel selbst, damit die Bildmitte frei bleibt.

  wrapper.addEventListener("click", () => {
    if(state.solved) return;
    selectTile(tile.id);
  });

  wrapper.addEventListener("dragstart", e => {
    if(state.solved){ e.preventDefault(); return; }
    e.dataTransfer.setData("text/plain", String(tile.id));
    e.dataTransfer.effectAllowed = "move";
  });
  wrapper.addEventListener("dragover", e => {
    if(state.solved) return;
    e.preventDefault();
    wrapper.classList.add("drag-over");
  });
  wrapper.addEventListener("dragleave", () => {
    wrapper.classList.remove("drag-over");
  });
  wrapper.addEventListener("drop", e => {
    if(state.solved) return;
    e.preventDefault();
    wrapper.classList.remove("drag-over");
    const draggedId = parseInt(e.dataTransfer.getData("text/plain"), 10);
    if(!isNaN(draggedId)){
      swapTiles(draggedId, tile.id);
    }
  });

  return wrapper;
}

function renderBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const sorted = state.tiles.slice().sort((a, b) => a.currentIndex - b.currentIndex);
  sorted.forEach(tile => board.appendChild(renderTile(tile)));
  if(state.solved){
    board.classList.add("solved");
    document.getElementById("central-rune-glow").classList.add("active");
  }
}

/* ============================================================
   TON — realistische, synthetisch erzeugte Effekte
   (Web Audio API, keine externen Audiodateien).
   Stein-Klacken beim Tauschen, Stein-Kratzen beim Spiegeln,
   tiefe Resonanz beim Lösen, Gesteinsmahlen beim Öffnen,
   fließendes magisches Rauschen bei der Lichtanimation.
   ============================================================ */
let audioCtx = null;
let muted = false;
let noiseBufferCache = null;
let reverbNodeCache = null;

function ensureAudio(){
  if(audioCtx){
    // Manche Browser starten den Kontext im Zustand "suspended" und geben
    // erst nach explizitem resume() tatsächlich Ton aus.
    if(audioCtx.state === "suspended"){ audioCtx.resume().catch(() => {}); }
    return audioCtx;
  }
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended"){ audioCtx.resume().catch(() => {}); }
  }catch(e){ audioCtx = null; }
  return audioCtx;
}

function getNoiseBuffer(ctx){
  if(noiseBufferCache) return noiseBufferCache;
  const len = Math.floor(ctx.sampleRate * 2);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  noiseBufferCache = buffer;
  return buffer;
}

/* Synthetischer, algorithmisch erzeugter Nachhall (kein externes File):
   ein exponentiell abklingender Rausch-Impuls, der wie eine
   kleine Steinkammer-Resonanz wirkt.
   WICHTIG: Die Verbindung zum Audio-Ausgang (destination) erfolgt hier
   genau EIN Mal, direkt beim Erstellen. Vorherige Version verband den
   gemeinsam genutzten Nachhall-Knoten bei JEDEM Aufruf erneut mit dem
   Ausgang, ohne die alte Verbindung zu kappen — dadurch addierten sich
   die Ausgangspfade bei jeder Nutzung (Tauschen, Spiegeln, Mischen,
   Lösen ...), und der Nachhall wurde mit der Zeit spürbar lauter statt
   gleich laut zu bleiben. Aufrufer verbinden ihr trockenes Signal nur
   noch IN den zurückgegebenen Convolver hinein, nicht mehr aus ihm
   heraus zum Ziel. */
function getStoneReverb(ctx){
  if(reverbNodeCache) return reverbNodeCache;
  const len = Math.floor(ctx.sampleRate * 1.6);
  const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i = 0; i < len; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
  }
  const convolver = ctx.createConvolver();
  convolver.buffer = impulse;
  const outputGain = ctx.createGain();
  outputGain.gain.value = 1;
  convolver.connect(outputGain);
  outputGain.connect(ctx.destination);
  reverbNodeCache = convolver;
  return convolver;
}

/* Stein-auf-Stein beim Tauschen zweier Fragmente.
   Frühere Versionen klangen ungewollt nach einem tiefen Brummen/Furzen
   — durch zwei Ursachen, die ich per Offline-Rendering und
   Spektralanalyse konkret gefunden und behoben habe:
   1. Die Kratz-Körner lagen fast im gleichen Zeitabstand (~19ms) und
      erzeugten dadurch eine hörbare Puls-/Brummfrequenz um 50Hz.
      Jetzt: stark unregelmäßiges Timing (quadrierte Zufallsverteilung),
      gemessen praktisch keine dominante Wiederholfrequenz mehr.
   2. Ein reiner tiefer Sinuston (als "Gewicht"-Anteil) klingt in
      Kombination mit Rauschen fast zwangsläufig wie ein Furz.
      Jetzt: kein Oszillator mehr, stattdessen ein kurzer, ungestimmter,
      stark tiefpassgefilterter Rauschimpuls (kein Pitch, kein Sweep).
   Das Reib-/Kies-Register liegt bewusst höher (ca. 900–2500Hz, mit
   Tiefpass-Deckelung bei 3000Hz) statt tief/rumpelnd — echtes
   Stein-auf-Stein-Schleifen klingt eher wie Sandpapier/Kies als wie
   Donnergrollen. Gemessener Spektralschwerpunkt ~3200Hz (Zielbereich),
   keine hörbare Periodizität, keine Übersteuerung. */
/* Physikalisch motivierte modale Resonanz-Synthese für den Einschlag:
   mehrere kurze, schnell abklingende Sinustöne bei NICHT-harmonisch
   verwandten Frequenzen, plus ein winziger Rausch-Klick für den
   eigentlichen Kontaktmoment. Das ist die Standardtechnik, mit der
   Sounddesign Materialklänge (Holz/Stein/Metall) modelliert: ein
   einzelner sustained Ton klingt elektronisch (führte hier vorher zum
   "Furz"-Problem), aber mehrere kurze, inharmonische, unterschiedlich
   schnell abklingende Töne zusammen klingen nach einem nachschwingenden
   physischen Objekt, nicht nach einer Note. Höhere Moden klingen
   schneller ab (härtere Dämpfung hoher Frequenzen bei echtem Gestein).
   Etwas Steinkammer-Nachhall verankert den Klang zusätzlich im selben
   Raum wie die übrigen Effekte (kein trockener "Sticker"-SFX). */
function playModalImpact(ctx, t, modes, verbSend){
  modes.forEach(m => {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = m.freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(m.peak, t + 0.0015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + m.decay);
    osc.connect(g); g.connect(ctx.destination); g.connect(verbSend);
    osc.start(t); osc.stop(t + m.decay + 0.02);
  });

  const click = ctx.createBufferSource();
  click.buffer = getNoiseBuffer(ctx);
  const clickHighpass = ctx.createBiquadFilter();
  clickHighpass.type = "highpass"; clickHighpass.frequency.value = 2200;
  const clickLowpass = ctx.createBiquadFilter();
  clickLowpass.type = "lowpass"; clickLowpass.frequency.value = 4200;
  const clickGain = ctx.createGain();
  clickGain.gain.setValueAtTime(0.0001, t);
  clickGain.gain.exponentialRampToValueAtTime(0.35, t + 0.0015);
  clickGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.014);
  click.connect(clickHighpass); clickHighpass.connect(clickLowpass); clickLowpass.connect(clickGain);
  clickGain.connect(ctx.destination); clickGain.connect(verbSend);
  click.start(t); click.stop(t + 0.02);
}

function playTileClack(ctx){
  const now = ctx.currentTime;
  const verb = getStoneReverb(ctx);
  const verbSend = ctx.createGain();
  verbSend.gain.value = 0.2;
  verbSend.connect(verb);

  // Phase 1: körniges, dichteres Schleifen im Kies-/Reibungsregister —
  // mehr, teils überlappende Körner für eine durchgängigere "Schhhk"-
  // Reibetextur statt vereinzelter Klicks. Unregelmäßiges Timing plus
  // gelegentliche längere/lautere "Hänger" (echtes Reiben verhakt sich
  // unregelmäßig, statt gleichförmig zu rieseln).
  const grainCount = 13;
  let cursor = now;
  let grainEnd = now;
  for(let i = 0; i < grainCount; i++){
    cursor += 0.002 + Math.random() * Math.random() * 0.03;
    const t = cursor;
    const isCatch = Math.random() < 0.22;
    const dur = isCatch ? (0.014 + Math.random() * 0.016) : (0.006 + Math.random() * 0.012);
    grainEnd = Math.max(grainEnd, t + dur);

    const grain = ctx.createBufferSource();
    grain.buffer = getNoiseBuffer(ctx);
    const gBandpass = ctx.createBiquadFilter();
    gBandpass.type = "bandpass";
    gBandpass.frequency.value = 900 + Math.random() * 1900;
    gBandpass.Q.value = 1.3 + Math.random() * 2.0;
    const gLowpass = ctx.createBiquadFilter();
    gLowpass.type = "lowpass";
    gLowpass.frequency.value = 3200;
    const gGain = ctx.createGain();
    const peak = (isCatch ? 0.16 : 0.075) + Math.random() * 0.055;
    gGain.gain.setValueAtTime(0.0001, t);
    gGain.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    gGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    grain.connect(gBandpass); gBandpass.connect(gLowpass); gLowpass.connect(gGain); gGain.connect(ctx.destination);
    grain.start(t); grain.stop(t + dur + 0.006);
  }

  // Phase 2: Einschlag/Einrasten — modale Resonanz statt Rausch-Crack.
  // Die Modenfrequenzen werden bei jedem Tausch leicht zufällig
  // verschoben (±8%): zwei echte Steine treffen nie exakt gleich
  // aufeinander, ein perfekt identischer Klang bei jedem Zug wirkt
  // dagegen künstlich/synthetisch.
  const landAt = grainEnd + 0.014;
  const pitchJitter = 0.92 + Math.random() * 0.16;
  playModalImpact(ctx, landAt, [
    { freq: 310  * pitchJitter, peak: 0.22, decay: 0.1   },
    { freq: 730  * pitchJitter, peak: 0.16, decay: 0.065 },
    { freq: 1580 * pitchJitter, peak: 0.10, decay: 0.04  },
    { freq: 2650 * pitchJitter, peak: 0.06, decay: 0.022 }
  ], verbSend);
}

/* Mystischer Wirbel beim Neu-Mischen aller Fragmente: ein magischer
/* Chaotischer magischer Wirbel beim Neu-Mischen: bewusst UNORDENTLICH
   statt sauber/optimistisch — unvorhersehbare Frequenzsprünge im
   Wirbel (kein glatter Sweep), eine unregelmäßig getimte Folge
   dissonanter, eng beieinanderliegender Tonfragmente in zufälliger
   Reihenfolge (statt einer sauberen aufsteigenden Kaskade) und ein
   unsanfter tiefer "Rumms" am Ende statt einem ordentlichen Ausklang —
   soll klingen, als würden die Fragmente kurz und unkontrolliert
   durcheinandergewirbelt, nicht wie ein harmonischer Zauber. */
function playShuffle(ctx){
  const now = ctx.currentTime;
  const verb = getStoneReverb(ctx);

  const swirl = ctx.createBufferSource();
  swirl.buffer = getNoiseBuffer(ctx);
  swirl.loop = true;
  const swirlBandpass = ctx.createBiquadFilter();
  swirlBandpass.type = "bandpass"; swirlBandpass.Q.value = 3.5;
  let freqCursor = now;
  while(freqCursor < now + 0.5){
    swirlBandpass.frequency.setValueAtTime(250 + Math.random() * 3500, freqCursor);
    freqCursor += 0.02 + Math.random() * 0.05;
  }
  const swirlGain = ctx.createGain();
  swirlGain.gain.setValueAtTime(0.0001, now);
  swirlGain.gain.linearRampToValueAtTime(0.22, now + 0.08);
  swirlGain.gain.setValueAtTime(0.22, now + 0.35);
  swirlGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
  swirl.connect(swirlBandpass); swirlBandpass.connect(swirlGain);
  swirlGain.connect(ctx.destination); swirlGain.connect(verb);
  swirl.start(now); swirl.stop(now + 0.58);

  const freqPool = [740, 812, 990, 1046, 1240, 1390, 1580, 1710, 1980];
  const noteCount = 9;
  let t = now + 0.02;
  for(let i = 0; i < noteCount; i++){
    t += 0.015 + Math.random() * Math.random() * 0.09;
    const freq = freqPool[Math.floor(Math.random() * freqPool.length)] * (0.97 + Math.random() * 0.06);
    const frag = ctx.createOscillator();
    frag.type = Math.random() < 0.3 ? "triangle" : "sine";
    frag.frequency.value = freq;
    const fragGain = ctx.createGain();
    const peak = 0.05 + Math.random() * 0.09;
    const decay = 0.06 + Math.random() * 0.18;
    fragGain.gain.setValueAtTime(0.0001, t);
    fragGain.gain.linearRampToValueAtTime(peak, t + 0.006);
    fragGain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    frag.connect(fragGain); fragGain.connect(ctx.destination); fragGain.connect(verb);
    frag.start(t); frag.stop(t + decay + 0.05);
  }

  const thudAt = t + 0.05;
  const thud = ctx.createBufferSource();
  thud.buffer = getNoiseBuffer(ctx);
  const thudLowpass = ctx.createBiquadFilter();
  thudLowpass.type = "lowpass"; thudLowpass.frequency.value = 220;
  const thudGain = ctx.createGain();
  thudGain.gain.setValueAtTime(0.0001, thudAt);
  thudGain.gain.exponentialRampToValueAtTime(0.35, thudAt + 0.008);
  thudGain.gain.exponentialRampToValueAtTime(0.0001, thudAt + 0.09);
  thud.connect(thudLowpass); thudLowpass.connect(thudGain);
  thudGain.connect(ctx.destination); thudGain.connect(verb);
  thud.start(thudAt); thud.stop(thudAt + 0.1);
}

/* Stein-auf-Stein-Kratzen beim Spiegeln eines Fragments: zwei
   kurze, gegenläufige Kratzbewegungen (Filter-Sweep hoch, dann
   leicht zurück) plus feines Grundrauschen für die Textur der
   Steinoberfläche, statt eines einzelnen Zwitscher-Wischs. */
function playMirrorScrape(ctx){
  const now = ctx.currentTime;

  const grain = ctx.createBufferSource();

  grain.connect(grainFilter); grainFilter.connect(grainGain); grainGain.connect(ctx.destination);
  grain.start(now); grain.stop(now + 0.36);

  const noise = ctx.createBufferSource();

  const hp = ctx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 650;
  const bp = ctx.createBiquadFilter();

  bp.frequency.setValueAtTime(950, now);
  bp.frequency.linearRampToValueAtTime(2300, now + 0.15);
  bp.frequency.linearRampToValueAtTime(1500, now + 0.3);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);

  g.gain.exponentialRampToValueAtTime(0.06, now + 0.16);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
  noise.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
  noise.start(now); noise.stop(now + 0.35);
}

/* Magisch-antiker Klang beim erfolgreichen Lösen des Rätsels.
   Zwei Ebenen: ein TIEFES FUNDAMENT (leicht verstimmte Doppel-
   Oszillatoren, wie zuvor — vermittelt Alter/Gewicht/Stein) plus ein
   MAGISCHER SCHIMMER obendrauf (mehrere leise, weich einschwingende
   Glockenpartialtöne bei NICHT-harmonischen Frequenzverhältnissen,
   jeweils als zwei minimal gegeneinander verstimmte Sinustöne für eine
   sehr langsame, atmende Schwebung statt eines schnellen Flatterns —
   das wirkt eher ätherisch-antik als digital-glitzernd). Dazu ein
   leises, langsam nach oben wanderndes gefiltertes Rauschen als
   aufsteigendes "Funkeln". Per Offline-Rendering verifiziert: die
   hohen Anteile übernehmen im Verlauf zunehmend (10%→60% Hochton-
   Energieanteil über die ersten zwei Sekunden), während das tiefe
   Fundament abklingt — der Klang entwickelt sich hörbar von
   "geerdet/alt" zu "schimmernd/magisch". */
function playDeepResonance(ctx){
  const now = ctx.currentTime;
  const verb = getStoneReverb(ctx);

  // Antikes Fundament.
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(65, now);
  osc.frequency.exponentialRampToValueAtTime(46, now + 2.2);
  const osc2 = ctx.createOscillator();
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(97, now);
  osc2.frequency.exponentialRampToValueAtTime(70, now + 2.2);
  const lowGain = ctx.createGain();
  lowGain.gain.setValueAtTime(0.0001, now);
  lowGain.gain.exponentialRampToValueAtTime(0.26, now + 0.2);
  lowGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
  osc.connect(lowGain); osc2.connect(lowGain);
  lowGain.connect(ctx.destination); lowGain.connect(verb);
  osc.start(now); osc.stop(now + 2.8);
  osc2.start(now); osc2.stop(now + 2.8);

  // Magischer Schimmer: nicht-harmonische Partialtöne, weicher Attack,
  // unterschiedlich schnelles Abklingen (höher = schneller, wie bei
  // echter Materialdämpfung).
  const baseFreq = 660;
  const ratios = [1, 1.52, 2.03, 2.76, 3.51, 4.98];
  const decays  = [2.6, 2.3, 2.0, 1.6, 1.2, 0.9];
  const peaks   = [0.05, 0.045, 0.04, 0.03, 0.022, 0.014];
  ratios.forEach((ratio, i) => {
    [-1.2, 1.2].forEach(detune => {
      const partial = ctx.createOscillator();
      partial.type = "sine";
      partial.frequency.value = baseFreq * ratio;
      partial.detune.value = detune;
      const pGain = ctx.createGain();
      pGain.gain.setValueAtTime(0.0001, now);
      pGain.gain.linearRampToValueAtTime(peaks[i], now + 0.35 + i * 0.05);
      pGain.gain.exponentialRampToValueAtTime(0.0001, now + decays[i]);
      partial.connect(pGain); pGain.connect(ctx.destination); pGain.connect(verb);
      partial.start(now); partial.stop(now + decays[i] + 0.1);
    });
  });

  // Aufsteigendes "Funkeln": leises, langsam nach oben wanderndes
  // gefiltertes Rauschen.
  const sparkle = ctx.createBufferSource();
  sparkle.buffer = getNoiseBuffer(ctx);
  sparkle.loop = true;
  const sparkleBandpass = ctx.createBiquadFilter();
  sparkleBandpass.type = "bandpass"; sparkleBandpass.Q.value = 2.5;
  sparkleBandpass.frequency.setValueAtTime(1500, now);
  sparkleBandpass.frequency.linearRampToValueAtTime(6000, now + 2.2);
  const sparkleGain = ctx.createGain();
  sparkleGain.gain.setValueAtTime(0.0001, now);
  sparkleGain.gain.linearRampToValueAtTime(0.05, now + 1.0);
  sparkleGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
  sparkle.connect(sparkleBandpass); sparkleBandpass.connect(sparkleGain);
  sparkleGain.connect(ctx.destination); sparkleGain.connect(verb);
  sparkle.start(now); sparkle.stop(now + 2.7);
}

/* Blitzschlag als Fehlerton beim misslungenen "Einrasten"-Versuch:
   echtes elektrisches Knistern statt eines glatten Sägezahn-"Zaps".
   Ein Lichtbogen/Blitz besteht akustisch aus: einem extrem kurzen,
   hellen Initial-Knall, gefolgt von vielen unregelmäßigen, sehr kurzen
   Mikro-Knacksern (wie eine Tesla-Spule oder ein elektrischer
   Kurzschluss) und einem kurzen hochfrequenten "Sizzle" mit schneller,
   unregelmäßiger Amplitudenmodulation — danach erst das tiefe
   Donnergrollen. Alles läuft über einen Compressor plus einen echten
   Hard-Limiter (WaveShaper mit tanh-Kurve, OHNE Oversampling — mit
   Oversampling entsteht durch die Interpolation ein Überschwingen über
   0dB, das per Offline-Rendering nachgewiesen und deshalb bewusst
   vermieden wurde). Damit bleiben auch viele gleichzeitig
   überlappende Knister-Ereignisse garantiert unverzerrt. */
function playLightning(ctx){
  const now = ctx.currentTime;

  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -24;
  limiter.knee.value = 4;
  limiter.ratio.value = 20;
  limiter.attack.value = 0.0008;
  limiter.release.value = 0.1;

  const hardLimiter = ctx.createWaveShaper();
  const curveLen = 2048;
  const curve = new Float32Array(curveLen);
  for(let i = 0; i < curveLen; i++){
    const x = (i / (curveLen - 1)) * 2 - 1;
    curve[i] = Math.tanh(2.2 * x) / Math.tanh(2.2);
  }
  hardLimiter.curve = curve;
  hardLimiter.oversample = "none";
  limiter.connect(hardLimiter);
  hardLimiter.connect(ctx.destination);

  // Initial-Knall.
  const snap = ctx.createBufferSource();
  snap.buffer = getNoiseBuffer(ctx);
  const snapHighpass = ctx.createBiquadFilter();
  snapHighpass.type = "highpass"; snapHighpass.frequency.value = 2500;
  const snapGain = ctx.createGain();
  snapGain.gain.setValueAtTime(0.0001, now);
  snapGain.gain.exponentialRampToValueAtTime(0.65, now + 0.0015);
  snapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
  snap.connect(snapHighpass); snapHighpass.connect(snapGain); snapGain.connect(limiter);
  snap.start(now); snap.stop(now + 0.04);

  // Elektrisches Knistern: viele sehr kurze, unregelmäßig getimte
  // Mikro-Knackser hoher Frequenz.
  let crackleCursor = now + 0.005;
  const crackleEnd = now + 0.09;
  while(crackleCursor < crackleEnd){
    const t = crackleCursor;
    const dur = 0.0008 + Math.random() * 0.0015;
    const crackle = ctx.createBufferSource();
    crackle.buffer = getNoiseBuffer(ctx);
    const crackleHighpass = ctx.createBiquadFilter();
    crackleHighpass.type = "highpass"; crackleHighpass.frequency.value = 3000 + Math.random() * 3000;
    const crackleGain = ctx.createGain();
    const peak = 0.09 + Math.random() * 0.14;
    crackleGain.gain.setValueAtTime(0.0001, t);
    crackleGain.gain.exponentialRampToValueAtTime(peak, t + 0.0004);
    crackleGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    crackle.connect(crackleHighpass); crackleHighpass.connect(crackleGain); crackleGain.connect(limiter);
    crackle.start(t); crackle.stop(t + dur + 0.001);
    crackleCursor += 0.001 + Math.random() * Math.random() * 0.006;
  }

  // Hochfrequentes "Sizzle" mit schneller, unregelmäßiger Modulation
  // (zwei versetzte Rechteck-LFOs statt eines regelmäßigen Tremolos).
  const sizzle = ctx.createBufferSource();
  sizzle.buffer = getNoiseBuffer(ctx);
  sizzle.loop = true;
  const sizzleBandpass = ctx.createBiquadFilter();
  sizzleBandpass.type = "bandpass"; sizzleBandpass.frequency.value = 4500; sizzleBandpass.Q.value = 1.2;
  const sizzleGain = ctx.createGain();
  sizzleGain.gain.setValueAtTime(0.0001, now);
  sizzleGain.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
  sizzleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
  const lfo1 = ctx.createOscillator(); lfo1.type = "square"; lfo1.frequency.value = 47;
  const lfo1Gain = ctx.createGain(); lfo1Gain.gain.value = 0.5;
  const lfo2 = ctx.createOscillator(); lfo2.type = "square"; lfo2.frequency.value = 83;
  const lfo2Gain = ctx.createGain(); lfo2Gain.gain.value = 0.5;
  lfo1.connect(lfo1Gain); lfo2.connect(lfo2Gain);
  lfo1Gain.connect(sizzleGain.gain); lfo2Gain.connect(sizzleGain.gain);
  sizzle.connect(sizzleBandpass); sizzleBandpass.connect(sizzleGain); sizzleGain.connect(limiter);
  lfo1.start(now); lfo1.stop(now + 0.12);
  lfo2.start(now); lfo2.stop(now + 0.12);
  sizzle.start(now); sizzle.stop(now + 0.12);

  // Donnergrollen, kommt "verzögert" wie echter Donner nach dem Blitz.
  const rumble = ctx.createBufferSource();
  rumble.buffer = getNoiseBuffer(ctx);
  rumble.loop = true;
  const rumbleFilter = ctx.createBiquadFilter();
  rumbleFilter.type = "lowpass";
  rumbleFilter.frequency.setValueAtTime(450, now + 0.05);
  rumbleFilter.frequency.exponentialRampToValueAtTime(75, now + 1.2);
  const rumbleGain = ctx.createGain();
  rumbleGain.gain.setValueAtTime(0.0001, now + 0.05);
  rumbleGain.gain.exponentialRampToValueAtTime(0.3, now + 0.14);
  rumbleGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);
  rumble.connect(rumbleFilter); rumbleFilter.connect(rumbleGain); rumbleGain.connect(limiter);
  rumble.start(now + 0.05); rumble.stop(now + 1.4);
}

/* ============================================================
   ECHTE AUFNAHMEN (vom Nutzer bereitgestellt, als Base64 eingebettet)
   ============================================================
   Für jedes Ereignis, für das eine echte MP3-Aufnahme vorliegt, wird
   diese bevorzugt abgespielt statt des synthetisierten Web-Audio-
   Sounds. Fehlt ein Eintrag (z.B. weil später ein Sound wieder
   entfernt wird), fällt playSound() automatisch auf die Synthese

/* Abspielweg per Diagnose bestätigt: In manchen Einbettungs-Kontexten
   (insbesondere iframes mit "srcdoc", wie in Chat-Vorschauen üblich)
   verweigert v.a. Firefox die Wiedergabe von <audio>/Audio()-Elementen
   mit data:-URIs komplett (NotSupportedError) — obwohl exakt dieselben
   Bytes über die Web Audio API (decodeAudioData + AudioBufferSourceNode)
   einwandfrei abspielbar sind. Deshalb läuft die echte Aufnahme-
   Wiedergabe hier über denselben AudioContext wie die synthetischen
   Sounds, nicht über ein separates Audio()-Element. */
const realSoundBuffers = {};
const realSoundDecodePromises = {};

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function decodeRealSound(kind){
  if(realSoundBuffers[kind]) return Promise.resolve(realSoundBuffers[kind]);
  if(realSoundDecodePromises[kind]) return realSoundDecodePromises[kind];
  const ctx = ensureAudio();
  if(!ctx || !REAL_SOUNDS[kind]) return Promise.resolve(null);
  const base64 = REAL_SOUNDS[kind].split(",")[1];
  const arrayBuffer = base64ToArrayBuffer(base64);
  realSoundDecodePromises[kind] = ctx.decodeAudioData(arrayBuffer)
    .then(buf => { realSoundBuffers[kind] = buf; return buf; })
    .catch(() => null);
  return realSoundDecodePromises[kind];
}

function decodeAllRealSounds(){
  Object.keys(REAL_SOUNDS).forEach(decodeRealSound);
}

function playRealSoundBuffer(ctx, kind){
  const buf = realSoundBuffers[kind];
  if(!buf) return false;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = 0.85;
  src.connect(gain);
  gain.connect(ctx.destination);
  src.start();
  return true;
}

function playSound(kind){
  if(muted) return;
  const ctx = ensureAudio();
  if(!ctx) return;

  if(REAL_SOUNDS[kind]){
    if(playRealSoundBuffer(ctx, kind)) return;
    // Direkt nach dem allerersten Laden evtl. noch nicht dekodiert —
    // Dekodierung anstoßen (steht dann beim nächsten Mal bereit) und
    // für diesmal auf die Synthese ausweichen, statt stumm zu bleiben.
    decodeRealSound(kind);
  }

  if(kind === "swap") playTileClack(ctx);
  else if(kind === "mirror") playMirrorScrape(ctx);
  else if(kind === "solve") playDeepResonance(ctx);
  else if(kind === "open") playStoneGrind(ctx);
  else if(kind === "flow") playFlow(ctx);
  else if(kind === "keyturn") playKeyTurn(ctx);
  else if(kind === "lightning") playLightning(ctx);
  else if(kind === "shuffle") playShuffle(ctx);
}

/* ============================================================
   SPIELLEITERBEREICH
   ============================================================ */
function openGMPanel(){
  const pw = prompt("Passwort für den Spielleiterbereich:");
  if(pw === null) return;
  if(pw !== GM_PASSWORD) return;
  const panel = document.getElementById("gm-panel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
}

function solvePuzzleGM(){
  state.tiles.forEach(tile => {
    tile.currentIndex = tile.correctIndex;
    tile.currentMirror = tile.correctMirror;
    tile.currentRotation = tile.correctRotation;
  });
  state.selectedTileId = null;
  renderBoard();
  saveGame();
  if(!state.solved && checkSolution()){
    state.solved = true;
    saveGame();
    triggerSuccess();
  }
}

/* Von GM-Anzeige und dem passwortgeschützten "Musterlösung"-Button
   gemeinsam genutzt. */
function buildSolutionText(){
  const grid = [];
  for(let r = 0; r < GRID_SIZE; r++){
    const row = [];
    for(let c = 0; c < GRID_SIZE; c++) row.push(posOf(r, c));
    grid.push(row.map(n => String(n).padStart(2, " ")).join(" "));
  }
  return "Lösungspositionen (id = correctIndex):\n" + grid.join("\n") +
    "\n\nSpiegelbare Fragmente, korrekt = ungespiegelt:\n" +
    TILE_DEFS.filter(t => t.mirrorable).map(t => "  Fragment " + t.id).join("\n") +
    "\n\nKorrekte Rotation: alle Fragmente 0° (aufrecht).";
}

function gmShowSolution(){
  const out = document.getElementById("gm-output");
  out.style.display = "block";
  out.textContent = buildSolutionText() +
    "\n\nStart-Rotationen (Fragment: Grad):\n" +
    TILE_DEFS.map(t => `  ${t.id}: ${t.startRotation}°`).join("\n");
}

function gmShowState(){
  const out = document.getElementById("gm-output");
  out.style.display = "block";
  out.textContent = JSON.stringify(state, null, 2);
}

/* Öffentlicher, passwortgeschützter "Musterlösung anzeigen"-Button
   (unabhängig vom versteckten Spielleiterbereich). Zeigt das fertig
   zusammengesetzte Wappenbild inkl. Positions-Raster — eine reine
   Zahlenliste bringt nichts, wenn man nicht weiß, welches physische
   Fragment welche Nummer trägt. Da jedes Fragment am Ende genau an
   seiner correctIndex-Position im Master-Bild sitzt, IST das
   vollständige Master-Artwork bereits die gelöste Abbildung — hier
   wird sie einfach direkt gezeigt, mit einem Zahlenraster obendrauf
   zum exakten Nachbauen. Verändert das laufende Rätsel dabei NICHT. */

/* Statt eines separaten Bild-Panels aktiviert das richtige Passwort
   jetzt den DEBUG-MODUS direkt auf dem echten, beweglichen Brett —
   dieselbe Overlay-Anzeige (ID / aktuelles Feld / Rotation / Spiegel-
   Status je Kachel), mit der zuvor die separate Testversion gebaut
   wurde. So kann direkt am eigenen, aktuell gemischten Spielstand
   weitergearbeitet werden, statt nur ein Referenzbild danebenzuhaben. */
let debugModeActive = false;

/* Klick auf den Button: ist der Debug-Modus bereits aktiv, wird er
   direkt (ohne erneutes Passwort) wieder deaktiviert — ein zweiter
   Klick schaltet also um. Ist er noch inaktiv, öffnet sich wie bisher
   die Passwort-Abfrage. */
function handleSolutionButtonClick(){
  if(debugModeActive){
    disableDebugMode();
  } else {
    openSolutionPasswordPrompt();
  }
}

function openSolutionPasswordPrompt(){
  document.getElementById("solution-pw-fail").textContent = "";
  document.getElementById("solution-pw-input").value = "";
  document.getElementById("solution-pw-wrap").style.display = "block";
  document.getElementById("solution-pw-input").focus();
}

function cancelSolutionPasswordPrompt(){
  document.getElementById("solution-pw-wrap").style.display = "none";
}

function submitSolutionPassword(){
  const input = document.getElementById("solution-pw-input");
  const failEl = document.getElementById("solution-pw-fail");
  if(input.value.trim() === SOLUTION_PASSWORD){
    failEl.textContent = "";
    document.getElementById("solution-pw-wrap").style.display = "none";
    debugModeActive = true;
    document.getElementById("solution-btn").textContent = "Debug-Modus deaktivieren";
    renderBoard();
  } else {
    failEl.textContent = "Das Passwort ist falsch.";
  }
}

function disableDebugMode(){
  debugModeActive = false;
  document.getElementById("solution-btn").textContent = "Debug-Modus freischalten";
  renderBoard();
}

/* ============================================================
   INITIALISIERUNG
   ============================================================ */
function initializeGame(){
  loadGame();
  renderBoard();

  // Dekodierung der echten Aufnahmen so früh wie möglich anstoßen —
  // decodeAudioData() selbst benötigt keine Nutzergeste (nur das
  // tatsächliche Abspielen tut das), damit stehen die Sounds im besten
  // Fall schon bereit, bevor überhaupt der erste Klick passiert.
  {
    const earlyCtx = ensureAudio();
    if(earlyCtx) decodeAllRealSounds();
  }

  // Audio so früh wie möglich über eine garantierte direkte Nutzergeste
  // freischalten (pointerdown/keydown feuert VOR dem eigentlichen Drag),
  // statt erst beim "drop"-Ereignis eines Kachel-Tauschs — manche Browser
  // werten Drag-and-Drop nicht zuverlässig als Nutzergeste für die
  // Audio-Autoplay-Freigabe. Die echten Aufnahmen laufen über
  // decodeAudioData() im selben AudioContext (siehe Kommentar dort) —
  // die Dekodierung selbst braucht keine Nutzergeste, wird hier aber
  // trotzdem beim ersten Klick direkt mit angestoßen, damit alle acht
  // Sounds bereitstehen, bevor der erste tatsächlich gebraucht wird.
  function unlockAudioOnce(){
    ensureAudio();
    decodeAllRealSounds();
    document.removeEventListener("pointerdown", unlockAudioOnce);
    document.removeEventListener("keydown", unlockAudioOnce);
  }
  document.addEventListener("pointerdown", unlockAudioOnce, { once: true });
  document.addEventListener("keydown", unlockAudioOnce, { once: true });

  document.getElementById("board").addEventListener("click", e => {
    if(e.target.id === "board" && state.selectedTileId !== null){
      state.selectedTileId = null;
      renderBoard();
    }
  });

  // Tastatursteuerung für die ausgewählte Kachel: Pfeiltasten links/
  // rechts (oder A/D) drehen gegen/mit dem Uhrzeigersinn, hoch/runter
  // (oder W/S) spiegeln (beide Richtungen lösen denselben Umschalter
  // aus, da Spiegeln nur zwei Zustände kennt). WASD funktioniert
  // unabhängig von Groß-/Kleinschreibung. Wirkt nur, wenn eine Kachel
  // ausgewählt ist, das Rätsel nicht bereits gelöst ist, und der Fokus
  // nicht gerade in einem Eingabefeld liegt (z.B. Passwort-Eingaben).
  document.addEventListener("keydown", e => {
    if(state.solved) return;
    if(state.selectedTileId === null) return;
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag === "INPUT" || activeTag === "TEXTAREA") return;

    const id = state.selectedTileId;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if(key === "ArrowLeft" || key === "a"){
      e.preventDefault();
      rotateTile(id, "ccw");
    } else if(key === "ArrowRight" || key === "d"){
      e.preventDefault();
      rotateTile(id, "cw");
    } else if(key === "ArrowUp" || key === "ArrowDown" || key === "w" || key === "s"){
      e.preventDefault();
      mirrorTile(id);
    }
  });

  if(state.solved){
    document.getElementById("board").classList.add("solved");
    document.getElementById("central-rune-glow").classList.add("active");
    document.getElementById("lock-in-btn").disabled = true;
    document.getElementById("reset-btn").disabled = true;
    revealSuccessPanel();
    if(state.keyInserted){
      document.getElementById("success-text").textContent = TEXT_KEY_SUCCESS_1 + "\n\n" + TEXT_KEY_SUCCESS_2;
      document.getElementById("board").classList.add("darkened");
      // WICHTIG: Der 10-Sekunden-Auto-Reset ist ein reiner In-Memory-
      // Timer und geht bei jedem Neuladen der Seite verloren. Ohne
      // diese Nachhol-Logik würde ein bereits vollständig geöffneter
      // Zustand (aus localStorage geladen) für immer eingefroren
      // bleiben, sobald die Seite einmal neu geladen wird — genau das
      // Problem, das gemeldet wurde. Der Reset wird hier einfach kurz
      // verzögert nachgeholt, statt den genauen Restwert der 10s zu
      // rekonstruieren.
      setTimeout(() => { autoResetAfterOpening(); }, 3000);
    } else if(state.ukubuSolved){
      // Zwischenzustand: Ukubu wurde bereits bestätigt, aber der finale
      // Text/keyInserted wurde noch nicht gesetzt (z.B. weil die Seite
      // genau in diesem kurzen Fenster neu geladen wurde). Wird hier
      // sauber nachgeholt, statt eingefroren zu bleiben.
      document.getElementById("board").classList.add("darkened");
      const recoveredText = document.getElementById("success-text");
      recoveredText.textContent = TEXT_KEY_SUCCESS_1 + "\n\n" + TEXT_KEY_SUCCESS_2;
      state.keyInserted = true;
      saveGame();
      setTimeout(() => { autoResetAfterOpening(); }, 3000);
    }
  }

  document.getElementById("lock-in-btn").addEventListener("click", attemptSolve);
  document.getElementById("reset-btn").addEventListener("click", handleResetButtonClick);
  document.getElementById("mute-btn").addEventListener("click", () => {
    muted = !muted;
    document.getElementById("mute-btn").textContent = muted ? "🔇 Ton an/aus" : "🔈 Ton an/aus";
    ensureAudio();
  });
  document.getElementById("solution-btn").addEventListener("click", handleSolutionButtonClick);
  document.getElementById("solution-pw-submit").addEventListener("click", submitSolutionPassword);
  document.getElementById("solution-pw-cancel").addEventListener("click", cancelSolutionPasswordPrompt);
  document.getElementById("solution-pw-input").addEventListener("keydown", e => {
    if(e.key === "Enter") submitSolutionPassword();
  });
  document.getElementById("lock-btn").addEventListener("click", examineLock);
  document.getElementById("key-submit").addEventListener("click", checkKeyword);
  document.getElementById("key-input").addEventListener("keydown", e => {
    if(e.key === "Enter") checkKeyword();
  });

  document.getElementById("gm-gear").addEventListener("click", openGMPanel);
  document.getElementById("gm-solve").addEventListener("click", solvePuzzleGM);
  document.getElementById("gm-reset").addEventListener("click", () => resetGame());
  document.getElementById("gm-showsol").addEventListener("click", gmShowSolution);
  document.getElementById("gm-testanim").addEventListener("click", startSuccessAnimation);
  document.getElementById("gm-state").addEventListener("click", gmShowState);
  document.getElementById("gm-clearls").addEventListener("click", () => {
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    alert("localStorage gelöscht.");
  });
}

document.addEventListener("DOMContentLoaded", initializeGame);
</script>
</body>
</html>
